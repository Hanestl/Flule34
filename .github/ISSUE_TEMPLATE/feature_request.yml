name: 功能建议
description: 建议符合产品架构的新能力
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户问题，不要只写解决方案名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不会要求猜测未验证的网站写接口参数。
          required: true
        - label: 该建议不会建立跨账号混用的匿名媒体库数据。
          required: true
